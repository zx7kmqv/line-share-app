name = "line-share-app"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# 送信先ID（家族グループ・自分）の保存先
# id を書かなくても、初回デプロイ時に wrangler が自動で作成し、以降は同じものを使う
[[kv_namespaces]]
binding = "LINE_KV"

# 定時実行（cron は UTC。"0 22 * * *" = 日本時間 7:00）
# src/features/*.ts の schedules に書いた cron と同じ文字列をここに並べる
# [triggers]
# crons = ["0 22 * * *"]

# シークレット（コードに書かない）。Cloudflare 管理画面の「変数とシークレット」でも登録できる:
#   npx wrangler secret put LINE_CHANNEL_SECRET
#   npx wrangler secret put LINE_CHANNEL_ACCESS_TOKEN
#   npx wrangler secret put API_TOKEN
# ローカル開発時は .dev.vars に書く（.dev.vars.example 参照）

name = "line-share-app"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# 送信先ID（家族グループ・自分）の保存先
# `npx wrangler kv namespace create LINE_KV` で作成し、表示された id に置き換える
[[kv_namespaces]]
binding = "LINE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# 毎朝のニュース配信などで使う（cron は UTC。"0 22 * * *" = 日本時間 7:00）
# [triggers]
# crons = ["0 22 * * *"]

# シークレット（コードに書かない）:
#   npx wrangler secret put LINE_CHANNEL_SECRET
#   npx wrangler secret put LINE_CHANNEL_ACCESS_TOKEN
#   npx wrangler secret put API_TOKEN
# ローカル開発時は .dev.vars に書く（.dev.vars.example 参照）
